{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h1 class="gradient-text">Create account</h1>
    <p class="muted">{% if first_account %}Create the initial administrator account.{% else %}Create an account for an approved member of your care team.{% endif %}</p>

    <form method="POST" id="registerForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field"><label for="username">Display name / username</label>
        <input id="username" name="username" autocomplete="username" required autofocus placeholder="Dr. Smith"></div>
      <div class="field"><label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@hospital.com"></div>
      <div class="field"><label for="password">Password (min 6 characters)</label>
        <input id="password" name="password" type="password" minlength="6" autocomplete="new-password" required></div>
      <div class="field"><label for="confirm_password">Confirm password</label>
        <input id="confirm_password" name="confirm_password" type="password" minlength="6" autocomplete="new-password" required></div>
      <button id="registerBtn" class="btn btn-primary btn-lg" type="submit">Create account</button>
    </form>
    <p class="note" style="text-align:center">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</div>
{% endblock %}
