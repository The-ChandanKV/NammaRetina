{% extends "base_auth.html" %}
{% block title %}Sign-in session expired{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="card auth-card">
  <h1>Start sign-in again</h1>
  <p class="muted">The sign-in response did not contain a valid authorization code. Return to sign-in to create a secure session.</p>
  <a class="btn btn-primary" href="{{ url_for('signin') }}">Return to sign-in</a>
</div></div>
<script>
// Remove obsolete token fragments without copying secrets into URLs or requests.
if (window.location.hash) window.history.replaceState(null, '', window.location.pathname);
</script>
{% endblock %}
